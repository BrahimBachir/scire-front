<mat-tab-group [(selectedIndex)]="selectedTabIndex" (selectedIndexChange)="onTabIndexChanged($event)">
    @for(tab of tabs; track tab.id) {
        <mat-tab>
            <ng-template mat-tab-label>
            <span (click)="tabSelected.emit(tab)">
                {{ tab.title || tab?.boeId?.toUpperCase() }}
            </span>
            <i-tabler  class="icon-18 m-l-5" [matTooltip]="tab.progress?.articleProgress ? tab.progress?.articleProgress  +'%' : '0%'"
                [name]="tab.progress?.articleProgress ? 'percentage-' + tab.progress?.articleProgress :  'percentage-0'">
            </i-tabler>
            </ng-template>
        </mat-tab>
        }
</mat-tab-group>
