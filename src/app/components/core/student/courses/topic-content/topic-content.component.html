<div class="d-flex align-items-stretch rounded">
  <mat-card class="cardWithShadow law-content rounded">
    <app-article-tabs [selectedTabIndex]="selectedTabIndex" [tabs]="tabs()" [progress]="progress" (tabSelected)="selectTab($event)">
    </app-article-tabs>
    @if(article()?.id){
      <app-article-stepper [article]="article()" (resetRequested)="resetArticle()" [progressFacade]="progress" [isInitialLoad]="firstLoad" [lastArticle]="selectedTabIndex === tabs.length - 1"  (nextArticleRequested)="goToNextTab()" (entityToCreate)="handleEntityCreationInput($event)" (nextStep)="onStepChange($event)"></app-article-stepper>
    }
  </mat-card>
  @if(article()){
  <mat-card class="cardWithShadow m-l-20 gen-actions ">
    <app-create-generic-element [article]="article()" [entityToCreate]="entityToCreate()"></app-create-generic-element>
  </mat-card>
  }
</div>
