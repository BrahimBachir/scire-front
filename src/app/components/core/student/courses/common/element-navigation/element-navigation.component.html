<div class="d-flex d-raw gap-16 p-t-0 p-x-15 p-b-15">
  <button mat-stroked-button color="warn" class="w-100" [disabled]="!canGoPrevious"
    (click)="onPrevious()">
    <i-tabler name="chevron-left" class="icon-18 d-flex text-primary"></i-tabler>
  </button>
  <button mat-stroked-button color="warn" class="w-100 d-flex d-raw"     [disabled]="!canGoNext"
    (click)="onNext()">
    <i-tabler name="chevron-right" class="icon-18 d-flex text-primary" label="Siguiente"></i-tabler>
  </button>
</div>
