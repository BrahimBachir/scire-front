<div class="row p-x-15">
  <mat-card class="shadow-none b-1 rounded p-15 col-xl-12">
    <div class="d-flex row justify-content-between m-l-0 m-r-0 p-b-15">
      <h4>Categorías</h4>
      <tabler-icon name="book" class="m-r-5"></tabler-icon>
    </div>
    <mat-card class="shadow-none b-1 rounded p-15">
      <mat-card-content>
        <div class="table-responsive">
          <table mat-table [dataSource]="categories" class="w-100">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">
                Nombre
              </th>
              <td mat-cell *matCellDef="let element" class="f-s-14">
                {{ element.name }}
              </td>
            </ng-container>

            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">
                Acciones
              </th>
              <td mat-cell *matCellDef="let element" class="action-link">
                <a (click)="remove(element.id)" matTooltip="Desasociar" class="m-r-10 cursor-pointer">
                  <i-tabler name="trash" class="icon-18"></i-tabler>
                </a>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
        </div>
      </mat-card-content>
    </mat-card>
    <div class="w-50">
      <button mat-flat-button (click)="create()" class="bg-light-primary text-primary m-l-0">
        <div class="d-flex align-items-center">
          <tabler-icon name="plus" class="m-r-5"></tabler-icon>
          <span class="mt-3">Añadir categoría</span>
        </div>
      </button>
    </div>
  </mat-card>
</div>
