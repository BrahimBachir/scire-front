<div class="d-flex col h-100">
  <mat-dialog-content class="flex-grow-1 p-x-0">
    <div class="d-flex w-100 align-items-center justify-content-between m-b-15">
      <h3 mat-dialog-title class="p-0">
        {{ mode === 'CREATING' ? 'Crear' : 'Asociar' }} sección
      </h3>
      <button mat-icon-button mat-dialog-close class="d-flex justify-content-center m-l-20 bg-error text-white">
        <i-tabler name="x" class="icon-20 d-flex"></i-tabler>
      </button>
    </div>

    @if(mode === 'SELECTING'){
    <form [formGroup]="selectForm" class="w-100">
      <div class="row w-100 p-b-15">
        <app-associated-category-filter class="col-lg-6" formControlName="categoryId"
          [parentId]="data.courseId"></app-associated-category-filter>
        <app-topic-section-filter class="col-lg-6" formControlName="sectionId"
          [parentId]="selectForm.get('categoryId')?.value || 0"></app-topic-section-filter>
      </div>
      <div class="d-flex w-100 justify-content-end">
        <button (click)="toCreateMode()" class="change-mode d-flex justify-content-center icon-40 p-8" mat-icon-button>
          <i-tabler name="circle-plus" class="icon-40 d-flex"></i-tabler>
        </button>
      </div>
    </form>
    } @else {
    <form [formGroup]="createForm" class="w-100">
      <div class="row w-100 p-b-15">
        <app-associated-category-filter class="col-lg-6" formControlName="categoryId"
          [parentId]="data.courseId"></app-associated-category-filter>
        <mat-form-field appearance="outline" class="w-100 col-lg-6">
          <mat-label>Nombre</mat-label>
          <input type="text" matInput required aria-label="Nombre" id="name" name="name" formControlName="name"
            placeholder="Nombre">
          @if(createForm.get('name')?.hasError('required')){
          <mat-error class="p-b-15">Requerido.*</mat-error>
          }
        </mat-form-field>
      </div>
      <div class="d-flex w-100 justify-content-end">
        <button (click)="toSelectMode()" class="change-mode d-flex justify-content-center icon-40 p-8" mat-icon-button>
          <i-tabler name="list-search" class="icon-40 d-flex"></i-tabler>
        </button>
      </div>
    </form>
    }
  </mat-dialog-content>

  <mat-dialog-actions class="d-flex p-x-0 justify-content-between">
    <div>
      @if(error){
      <mat-error class="f-s-12 m-t-10">
        {{ error }}
      </mat-error>
      }
    </div>
    <div class="d-flex justify-content-end">
      <button mat-button mat-dialog-close>
        Cancelar
      </button>

      @if(mode === 'SELECTING'){
      <button mat-flat-button color="primary" [disabled]="form.invalid || loading" (click)="submit()">
        {{ loading ? 'Asociando...' : 'Asociar' }}
      </button>
      } @else {
      <button mat-flat-button color="primary" [disabled]="form.invalid || loading" (click)="submit()">
        {{ loading ? 'Creando...' : 'Crear' }}
      </button>
      }
    </div>
  </mat-dialog-actions>
</div>
