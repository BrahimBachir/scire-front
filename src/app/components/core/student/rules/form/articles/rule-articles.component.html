<div class="row p-x-15 p-t-15">
  <mat-card class="shadow-none b-1 rounded p-15  col-xl-12">
    <div class="d-flex row justify-content-between m-l-0 m-r-0 p-b-15">
      <h4>Artículos</h4>
      <tabler-icon name="presentation-analytics" class="m-r-5"></tabler-icon>
    </div>
    <mat-card class="shadow-none b-1 rounded">
      <mat-card-content>
        <div class="table-responsive topics-container">
          <table mat-table [dataSource]="articles.controls" class="w-100">

            <ng-container matColumnDef="title">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-t-0">{{ "LABELS.ARTICLE.TITLE" | translate
                }}</th>
              <td mat-cell *matCellDef="let element; let i = index" class="f-s-14">
                {{ element.value.title }}
              </td>
            </ng-container>

            <ng-container matColumnDef="content">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-t-0">{{ "LABELS.ARTICLE.CONTENT" | translate
                }}
              </th>
              <td mat-cell *matCellDef="let element" class="f-s-14">
                {{ element.value.content | slice:0:50 }}...
              </td>
            </ng-container>

            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600 p-t-0">{{ "LABELS.ARTICLE.ACTIONS" | translate
                }}
              </th>
              <td mat-cell *matCellDef="let element; let i = index" class="action-link">
                <a (click)="update(i)" class="m-r-10 cursor-pointer"><i-tabler name="edit"
                    class="icon-18"></i-tabler></a>
                <a (click)="remove(i)" class="m-r-10 cursor-pointer text-danger"><i-tabler name="trash"
                    class="icon-18"></i-tabler></a>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns; trackBy: trackByFn"></tr>
          </table>
        </div>
      </mat-card-content>
    </mat-card>
    <div class="w-50">
      <button mat-flat-button (click)="create()" class="bg-light-primary text-primary m-l-0">
        <div class="d-flex align-items-center">
          <tabler-icon name="plus" class="m-r-5"></tabler-icon>
          <span class="mt-3">Añadir artículo</span>
        </div>
      </button>
    </div>
  </mat-card>
</div>
