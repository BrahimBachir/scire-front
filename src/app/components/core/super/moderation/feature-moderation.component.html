<mat-card class="cardWithShadow m-b-0">
  <mat-card-header class="b-b-1">
    <mat-card-title>Elementos pendientes de moderación</mat-card-title>
  </mat-card-header>
  <mat-card-content class="module-list">
    @if(items) {
    <div class="table-responsive" style="max-height: 65vh; overflow-y: auto;">
      <table mat-table [dataSource]="items" class="w-100">
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Tipo</th>
          <td mat-cell *matCellDef="let item">{{ featureTypeLabel(item.featureType) }}</td>
        </ng-container>

        <ng-container matColumnDef="summary">
          <th mat-header-cell *matHeaderCellDef>Contenido</th>
          <td mat-cell *matCellDef="let item">{{ item.summary }}</td>
        </ng-container>

        <ng-container matColumnDef="creator">
          <th mat-header-cell *matHeaderCellDef>Autor</th>
          <td mat-cell *matCellDef="let item">
            <div>{{ item.creator?.name ?? '-' }}</div>
            <div class="f-s-12">{{ item.creator?.email ?? '-' }}</div>
          </td>
        </ng-container>

        <ng-container matColumnDef="dislikes">
          <th mat-header-cell *matHeaderCellDef>Dislikes</th>
          <td mat-cell *matCellDef="let item">
            <div class="d-flex align-items-center gap-5">
              {{ item.dislikeCount }}
              <button mat-icon-button type="button" matTooltip="Ver comentarios" (click)="showReactions(item)">
                <i-tabler name="eye" class="icon-18"></i-tabler>
              </button>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let item" class="d-flex gap-5 justify-content-end">
            <button mat-icon-button type="button" matTooltip="Editar y republicar"
              [disabled]="processingId === item.id" (click)="editAndRepublish(item)">
              <i-tabler name="pencil" class="icon-18"></i-tabler>
            </button>
            <button mat-icon-button color="primary" type="button" matTooltip="Marcar correcto"
              [disabled]="processingId === item.id" (click)="markAsCorrect(item)">
              <i-tabler name="check" class="icon-18"></i-tabler>
            </button>
            <button mat-icon-button color="warn" type="button" matTooltip="Descartar"
              [disabled]="processingId === item.id" (click)="discard(item)">
              <i-tabler name="ban" class="icon-18"></i-tabler>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      @if(!items.length) {
      <app-banner-nof-found class="w-100" bannerText="No hay elementos pendientes de moderación."
        bannerTitle="Todo al día."></app-banner-nof-found>
      }
    </div>
    } @else {
    <div class="h-100 d-flex align-items-center justify-content-center p-10">
      <mat-spinner></mat-spinner>
    </div>
    }
  </mat-card-content>
</mat-card>
