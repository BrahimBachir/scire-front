<mat-card class="cardWithShadow m-b-0">
  <mat-card-header class="b-b-1 d-flex align-items-center justify-content-between w-100">
    <mat-card-title>Usuarios</mat-card-title>
    <div class="d-flex gap-10">
      @if(selected.size > 0) {
      <button mat-stroked-button color="warn" type="button" (click)="deleteSelected()">
        Eliminar ({{ selected.size }})
      </button>
      }
      <button mat-flat-button color="primary" type="button" (click)="openCreateDialog()">
        <i-tabler name="plus" class="icon-18"></i-tabler>
        Nuevo usuario
      </button>
    </div>
  </mat-card-header>

  <mat-card-content class="module-list">
    <div class="col-md-4 m-b-15">
      <search-term-filter [formControl]="searchControl"></search-term-filter>
    </div>

    @if(loading) {
    <div class="h-100 d-flex align-items-center justify-content-center p-10">
      <mat-spinner></mat-spinner>
    </div>
    } @else {
    <div class="table-responsive">
      <table mat-table [dataSource]="users" class="w-100">
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox [checked]="isAllSelected()" (change)="toggleSelectAll()"></mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let user">
            <mat-checkbox [checked]="isSelected(user.id)" (change)="toggleSelection(user.id)"></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="full_name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let user">{{ user.full_name }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ primaryEmail(user) }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let user">{{ user.role?.description }}</td>
        </ng-container>

        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let user">
            <span class="{{ user.active ? 'text-success' : 'text-error' }}">
              {{ user.active ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let user" class="d-flex gap-10 justify-content-end">
            <button mat-icon-button type="button" (click)="openEditDialog(user)">
              <i-tabler name="edit" class="icon-18"></i-tabler>
            </button>
            <button mat-icon-button type="button" (click)="deleteOne(user)">
              <i-tabler name="trash" class="icon-18 text-error"></i-tabler>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      @if(!users.length) {
      <app-banner-nof-found class="w-100" bannerText="No hay usuarios que coincidan con la búsqueda."
        bannerTitle="Sin resultados."></app-banner-nof-found>
      }
    </div>

    <mat-paginator [length]="total" [pageIndex]="pageIndex" [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions" (page)="onPageChange($event)">
    </mat-paginator>
    }
  </mat-card-content>
</mat-card>
