<mat-form-field appearance="outline" class="w-100">
    <mat-label>{{ 'LABELS.YEAR_PICKER' | translate }}</mat-label>
    <input matInput [matDatepicker]="picker" [formControl]="date" [min]="minDate" [placeholder]="'LABELS.YEAR_PICKER_PLACEHOLDER' | translate" />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker startView="multi-year" (yearSelected)="chosenYearHandler($event, picker)"></mat-datepicker>
    @if(date.hasError('required')){
    <mat-error>
        {{ 'LABELS.VALIDATION.REQUIRED_FIELD' | translate }}
    </mat-error>
    }
</mat-form-field>
