<h2 mat-dialog-title>{{ 'DIALOGS.WARN.TITLE' | translate }}</h2>
<mat-dialog-content>
  {{ (itemCount > 1 ? 'DIALOGS.WARN.CONFIRM_PLURAL' : 'DIALOGS.WARN.CONFIRM_SINGULAR') | translate }}
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>{{ 'DIALOGS.WARN.CANCEL_BUTTON' | translate }}</button>
  <button
    mat-button
    mat-dialog-close
    cdkFocusInitial
    class="text-error"
    (click)="confirmDelete()"
  >
    {{ 'DIALOGS.WARN.CONFIRM_BUTTON' | translate }}
  </button>
</mat-dialog-actions>
