<div class="d-flex align-items-center justify-content-between m-r-20">
  <h3 mat-dialog-title>{{ 'DIALOGS.DELETE.TITLE' | translate }}</h3>
  <button mat-icon-button mat-dialog-close class="d-flex justify-content-center m-l-20 bg-error text-white">
    <i-tabler name="x" class="icon-20 d-flex"></i-tabler>
  </button>
</div><mat-dialog-content>
  {{ (itemCount > 1 ? 'DIALOGS.DELETE.CONFIRM_PLURAL' : 'DIALOGS.DELETE.CONFIRM_SINGULAR') | translate }}
</mat-dialog-content>
<mat-dialog-actions>
  <button
    mat-button
    mat-dialog-close
    cdkFocusInitial
    class="text-error"
    (click)="confirmDelete()"
  >
    {{ 'DIALOGS.DELETE.CONFIRM_BUTTON' | translate }}
  </button>
</mat-dialog-actions>
