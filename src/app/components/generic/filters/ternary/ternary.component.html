<mat-form-field appearance="outline" class="w-100">
  <mat-label>{{ config?.label }}</mat-label>

  <mat-select [formControl]="control" (blur)="onTouched()">
    @for(option of config?.items; track option.description) {
      <mat-option [value]="option.value">
        {{ option.description }}
      </mat-option>
    }
  </mat-select>

  @if (control.value !== null) {
    <mat-icon 
      matSuffix 
      class="d-flex justify-content-center align-items-center cursor-pointer" 
      (click)="clean(); $event.stopPropagation()">
      <i-tabler name="x" class="icon-15 d-flex justify-content-center align-items-center"></i-tabler>
    </mat-icon>
  }
</mat-form-field>
