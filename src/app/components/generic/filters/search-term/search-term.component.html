<mat-form-field appearance="outline" class="w-100">
  <mat-label>{{ 'LABELS.FILTERS.SEARCH_LABEL' | translate }}</mat-label>
  <input
    matInput
    type="text"
    [placeholder]="'LABELS.FILTERS.SEARCH_PLACEHOLDER' | translate"
    [formControl]="control"
    (blur)="onTouched()" />
  
  <mat-icon matPrefix class="d-flex justify-content-center align-items-center">
    <i-tabler name="search" class="icon-15 d-flex justify-content-center align-items-center"></i-tabler>
  </mat-icon>

  @if (control.value) {
    <mat-icon 
      matSuffix 
      class="d-flex justify-content-center align-items-center cursor-pointer" 
      (click)="clean()">
      <i-tabler name="x" class="icon-15 d-flex justify-content-center align-items-center"></i-tabler>
    </mat-icon>
  }
</mat-form-field>
